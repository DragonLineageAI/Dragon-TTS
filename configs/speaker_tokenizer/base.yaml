# Base config for Dragon-TTS speaker tokenizer.
# Usage:
#   python scripts/train.py --config-name base \
#       data.manifest=/path/train.jsonl \
#       ecapa_ckpt=/path/ecapa_tdnn.pt

defaults:
  - _self_

# ECAPA checkpoint (state_dict for ECAPA_TDNN_GLOB_c512(feat_dim=128, embed_dim=1024)).
ecapa_ckpt: ???

# SpeakerTokenizer hyperparams.
model:
  input_dim: 128
  out_dim: 1024
  latent_dim: 128
  token_num: 32
  fsq_levels: [4, 4, 4, 4, 4, 4]
  fsq_num_quantizers: 1
  perceiver_depth: 2
  ecapa_channels: 512

# Mel-spectrogram (khớp SparkVox bicodec.24k.yaml).
mel:
  sample_rate: 24000
  n_fft: 1024
  win_length: 640
  hop_length: 320
  n_mels: 128
  f_min: 10.0
  f_max: null

data:
  manifest: ???
  crop_seconds: 4.0
  min_seconds: 1.0
  val_speaker_frac: 0.05
  batch_size: 64
  num_workers: 8
  seed: 0

loss_weights:
  mse: 1.0
  cosine: 0.0   # đặt > 0 (vd 0.5 - 1.0) để bật (1 - cos(x_vec, d_vec)).mean()

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  max_steps: 200000
  min_lr_ratio: 1.0e-2

trainer:
  max_epochs: 200
  max_steps: -1  # if > 0 overrides max_epochs
  precision: bf16-mixed
  accelerator: gpu
  devices: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  limit_train_batches: null
  limit_val_batches: null
  check_val_every_n_epoch: 1

output_dir: outputs
run_name: speaker_tokenizer
seed: 1234
