[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragon-tts"
version = "0.1.0"
description = "Standalone speaker tokenizer with frozen ECAPA-TDNN and ResidualFSQ quantizer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Dragon-TTS contributors" }]

dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "einops>=0.7",
    "einx>=0.3",
    "packaging",
    "pytorch-lightning>=2.2",
    "hydra-core>=1.3",
    "omegaconf",
    "numpy",
    "soundfile",
    "tqdm",
    "tensorboard",
    "transformers>=4.51",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "scikit-learn",
    "matplotlib",
]
# LLM-TTS component (Orpheus-style). SNAC codec + HF datasets for training data.
llm_tts = [
    "snac>=1.2",
    "datasets>=2.18",
]
# Optional vLLM streaming inference backend (heavy; CUDA-only).
vllm = [
    "vllm>=0.5",
]

[tool.setuptools.packages.find]
include = ["dragon_tts*"]
